# Alembic da Quick Click. A URL do banco nunca fica aqui: ela vem do módulo de configuração
# (DATABASE_URL). Use pelo script, que confere se a migração é só aditiva:
#     python -m scripts.migrar --status | --sql | --conferir | --marcar | --aplicar
[alembic]
script_location = backend/infrastructure/banco/migracoes
prepend_sys_path = .
path_separator = os
